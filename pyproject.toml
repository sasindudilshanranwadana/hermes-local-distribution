[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-local-distribution"
version = "0.1.0a1"
description = "Private-alpha installer for a hardened local Hermes system"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
hermes-local-setup = "hermes_local_setup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["hermes_local_setup"]
branch = true
omit = [
  "src/hermes_local_setup/gui.py",
  "src/hermes_local_setup/packaged_entry.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["services/preclassifier"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hermes_local_setup"]
