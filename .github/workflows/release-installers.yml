name: Build private-alpha installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Tk runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=hermes_local_setup --cov-fail-under=80
      - run: python -m PyInstaller --noconfirm --clean hermes-local-setup.spec
      - name: Write checksums
        run: python scripts/write_checksums.py dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: hermes-local-setup-${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
      - name: Archive platform artifacts
        run: python scripts/archive_release_assets.py release-assets
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: release-assets/*.zip
          generate_release_notes: true
