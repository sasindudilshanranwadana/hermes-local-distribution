name: Build private-alpha installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Tk runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=hermes_local_setup --cov-fail-under=80
      - run: python -m PyInstaller --noconfirm --clean hermes-local-setup.spec
      - name: Write checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: find dist -type f -maxdepth 3 -exec shasum -a 256 {} \; > dist/SHA256SUMS.txt
      - name: Write checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem dist -File -Recurse | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-local-setup-${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Archive platform artifacts
        run: |
          for directory in release-assets/*; do
            archive="${directory}.zip"
            (cd "$directory" && zip -r "../../$archive" .)
          done
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: release-assets/*.zip
          generate_release_notes: true
