name: hermes-local-distribution

services:
  redis:
    image: redis@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - omniroute_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  omniroute:
    build:
      context: ./omniroute
      dockerfile: Dockerfile.hardened
    restart: unless-stopped
    env_file: ["${HERMES_LOCAL_SECRETS_FILE:?Run the setup wizard first}"]
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      DASHBOARD_PORT: "20128"
      API_PORT: "20129"
      API_HOST: 0.0.0.0
      HOSTNAME: 0.0.0.0
      LIVE_WS_PORT: "20132"
      LIVE_WS_HOST: 0.0.0.0
      LIVE_WS_ALLOWED_ORIGINS: http://127.0.0.1:20128
      LIVE_WS_ALLOWED_HOSTS: 127.0.0.1,localhost
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:20128
      OMNIROUTE_BASE_URL: http://127.0.0.1:20128
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "hermes-local:"
      OMNIROUTE_MEMORY_MB: "2048"
      NODE_OPTIONS: --max-old-space-size=2048
      OMNIROUTE_CHAT_MAX_HEAVY_IN_FLIGHT: "1"
      OMNIROUTE_CHAT_ADMISSION_HEALTHY_HEADROOM: "1"
      OMNIROUTE_CHAT_ADMISSION_QUEUE_MS: "8000"
      OMNIROUTE_DIRECT_HEADERS_TIMEOUT_MS: "60000"
      OMNIROUTE_MCP_ENFORCE_SCOPES: "true"
      OMNIROUTE_MCP_COMPRESS_DESCRIPTIONS: "true"
      MCP_TOOL_ALLOW: omniroute_get_health,omniroute_check_quota,omniroute_cost_report,omniroute_get_provider_metrics,omniroute_explain_route,omniroute_compression_status,omniroute_list_models_catalog,omniroute_simulate_route,omniroute_get_session_snapshot,omniroute_list_combos
    ports:
      - "127.0.0.1:20128:20128"
      - "127.0.0.1:20129:20129"
      - "127.0.0.1:20132:20132"
    volumes:
      - omniroute_data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal, frontend]

  preclassifier:
    build:
      context: ./preclassifier
      target: runtime
    restart: unless-stopped
    env_file: ["${HERMES_LOCAL_SECRETS_FILE:?Run the setup wizard first}"]
    environment:
      OMNIROUTE_BASE: http://omniroute:20129/v1
      OMNIROUTE_DB_PATH: /omniroute-data/storage.sqlite
      OMNIROUTE_API_KEY_NAME: HermesLocal
      LOCAL_CLASSIFIER_ENABLED: "false"
    ports:
      - "127.0.0.1:8801:8801"
    volumes:
      - preclassifier_logs:/app/logs
      - omniroute_data:/omniroute-data:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8801/readyz', timeout=3)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5
    depends_on:
      omniroute:
        condition: service_healthy
    networks: [internal, frontend]

  mem0-postgres:
    profiles: ["mem0"]
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: ["${HERMES_LOCAL_SECRETS_FILE:?Run the setup wizard first}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mem0}
      POSTGRES_USER: ${POSTGRES_USER:-mem0}
    volumes:
      - mem0_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [memory]

  mem0-api:
    profiles: ["mem0"]
    build:
      context: ./mem0/source/server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ["${HERMES_LOCAL_SECRETS_FILE:?Run the setup wizard first}"]
    environment:
      AUTH_DISABLED: "false"
      MEM0_TELEMETRY: "false"
    ports:
      - "127.0.0.1:8888:8000"
    depends_on:
      mem0-postgres:
        condition: service_healthy
    networks: [memory, frontend]

volumes:
  omniroute_redis:
  omniroute_data:
  preclassifier_logs:
  mem0_postgres:

networks:
  internal:
    internal: true
  memory:
    internal: true
  frontend:
